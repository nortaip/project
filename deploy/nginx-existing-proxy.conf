# Serverdə artıq nginx işləyirsə (80/443 onda) — Ellit-i onun arxasına qoşmaq.
#   cp deploy/nginx-existing-proxy.conf /etc/nginx/sites-available/ellit.conf
#   ln -s /etc/nginx/sites-available/ellit.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ellit.az -d www.ellit.az -d api.ellit.az     # HTTPS
# deploy/.env-də: WEB_SITE=http://ellit.az API_SITE=http://api.ellit.az
#                 HTTP_BIND=127.0.0.1:8088 HTTPS_BIND=127.0.0.1:8443 TRUSTED_PROXIES=private_ranges

map $http_upgrade $ellit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ellit.az www.ellit.az api.ellit.az;

    client_max_body_size 25m;          # fayl yükləmə limiti (API-dəki 20 MB + ehtiyat)

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # DİQQƏT: əlavə etmə ($proxy_add_x_forwarded_for) YOX, əvəz etmə —
        # istifadəçi saxta başlıq göndərsə belə backend həqiqi IP-ni görür
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (websocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ellit_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
