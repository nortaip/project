    default-src 'self' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com;

    frame-src   https://www.googletagmanager.com https://*.googlesyndication.com;
    object-src  'none';
    base-uri    'self';
    form-action 'self' https://epoint.az;
    frame-ancestors 'none';
