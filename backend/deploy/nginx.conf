# Ellit API — nginx reverse proxy (production)
# TLS: certbot --nginx ilə avtomatik. HTTP→HTTPS yönləndirmə daxildir.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name api.ellit.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ellit.az;

    ssl_certificate     /etc/letsencrypt/live/api.ellit.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ellit.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Təhlükəsizlik başlıqları (API öz başlıqlarını da göndərir)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10m;   # fayl yükləmə limiti
    limit_req zone=api burst=60 nodelay;

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
