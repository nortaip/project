# Nginx konfiqurasiyası — assetlinks.json üçün düzgün content-type
#
# Bu snippet-i mövcud nginx server bloku içində yerləşdirin:
#
# server {
#     listen 443 ssl;
#     server_name ellit.az www.ellit.az;
#     root /var/www/ellit/dist;
#     ...
#     <SNIPPET BURADA>
# }

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Content-Type "application/json" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
